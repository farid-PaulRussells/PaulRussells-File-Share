<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PaulRussells File Share</title>
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/src/theme.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-logo" src="/brand-logo.png" alt="Paul Russells" />
      <span class="brand-divider"></span>
      <span class="brand-name">File Share</span>
    </div>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch theme" title="Switch theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="app-main">
    <!-- Options before sharing -->
    <section class="view card" id="optionsView" hidden>
      <div class="file-chip">
        <div class="file-chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
        </div>
        <div>
          <h1 id="optFileName">Preparing share…</h1>
          <small>Choose how this share works</small>
        </div>
      </div>

      <div class="opt-row">
        <label for="password">Password (optional)</label>
        <input type="password" id="password" placeholder="Leave blank for no password" />
      </div>
      <div class="opt-grid">
        <div class="opt-row">
          <label for="expiry">Expires</label>
          <select id="expiry"></select>
        </div>
        <div class="opt-row">
          <label for="maxDownloads">Max downloads</label>
          <input type="number" id="maxDownloads" min="1" placeholder="Unlimited" />
        </div>
      </div>

      <label class="switch-row" for="keepAwake">
        <svg class="switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg>
        <span class="switch-text">
          <strong>Keep PC awake while sharing</strong>
          <small>Stops sleep mode until sharing ends. The screen can still turn off.</small>
        </span>
        <input type="checkbox" class="switch" id="keepAwake" checked />
      </label>

      <div class="options-actions">
        <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
        <button type="button" id="startBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          Start sharing
        </button>
      </div>
    </section>

    <!-- Live share -->
    <section class="view" id="shareView" hidden>
      <div class="server-stage" id="serverStage" data-state="booting">
        <svg viewBox="34 24 332 102" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <g class="server-art">
            <line class="s-link" x1="170" y1="62" x2="68" y2="40" />
            <line class="s-link" x1="170" y1="84" x2="68" y2="108" />
            <line class="s-link" x1="230" y1="62" x2="332" y2="40" />
            <line class="s-link" x1="230" y1="84" x2="332" y2="108" />
            <circle class="s-ring r1" cx="200" cy="72" r="32" />
            <circle class="s-ring r2" cx="200" cy="72" r="32" />
            <circle class="s-ring r3" cx="200" cy="72" r="32" />
            <rect class="s-node n1" x="50" y="32" width="18" height="16" rx="4" />
            <rect class="s-node n2" x="50" y="100" width="18" height="16" rx="4" />
            <rect class="s-node n3" x="332" y="32" width="18" height="16" rx="4" />
            <rect class="s-node n4" x="332" y="100" width="18" height="16" rx="4" />

            <g class="pc">
              <rect class="s-body" x="168" y="44" width="64" height="42" rx="5" />
              <rect class="s-screen" x="173" y="49" width="54" height="30" rx="2" />
              <rect class="pc-scan" x="173" y="63" width="54" height="2" />
              <rect class="s-line" x="182" y="71" width="36" height="3" rx="1.5" />
              <rect class="pc-bar" x="182" y="71" width="36" height="3" rx="1.5" />
              <path class="s-body" d="M193 86h14l3 10h-20z" />
            </g>

            <g class="rack">
              <g class="rack-unit u1">
                <rect class="s-body" x="170" y="44" width="60" height="17" rx="3" />
                <rect class="s-screen" x="177" y="50" width="26" height="5" rx="1" />
                <circle class="s-led l1" cx="213" cy="52.5" r="2.2" />
                <circle class="s-led l2" cx="221" cy="52.5" r="2.2" />
              </g>
              <g class="rack-unit u2">
                <rect class="s-body" x="170" y="64" width="60" height="17" rx="3" />
                <rect class="s-screen" x="177" y="70" width="26" height="5" rx="1" />
                <circle class="s-led l2" cx="213" cy="72.5" r="2.2" />
                <circle class="s-led l3" cx="221" cy="72.5" r="2.2" />
              </g>
              <g class="rack-unit u3">
                <rect class="s-body" x="170" y="84" width="60" height="17" rx="3" />
                <rect class="s-screen" x="177" y="90" width="26" height="5" rx="1" />
                <circle class="s-led l3" cx="213" cy="92.5" r="2.2" />
                <circle class="s-led l1" cx="221" cy="92.5" r="2.2" />
              </g>
            </g>
          </g>
        </svg>
        <div class="stage-label"><span class="stage-dot"></span><span id="stageText">Converting this PC into a server…</span></div>
      </div>

      <div class="share-head">
        <h1 id="fileName">Preparing share…</h1>
        <div class="status" id="status">Reading file…</div>
        <div class="meta-row">
          <span class="pill" id="expiryEl"></span>
          <span class="pill" id="downloadsEl"></span>
          <span class="pill ok" id="keepAwakeEl" hidden></span>
        </div>
      </div>

      <div class="qr-card card">
        <div class="qr-wrap"><img id="qr" alt="QR code for the share link" /></div>
        <div class="link-row">
          <input id="link" type="text" readonly value="" placeholder="Link appears when the server is online" />
          <button type="button" id="copyBtn">Copy</button>
        </div>
      </div>
      <button type="button" id="stopBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span class="btn-label">Stop sharing</span>
      </button>
    </section>
  </main>

  <footer class="app-footer">
    <p class="hint">Keep this app open while others download. Anyone with the link or QR code can download, so add a password for anything sensitive.</p>
    <p class="credit">Developed by <strong>Faridul Islam</strong></p>
  </footer>

  <script type="module" src="/src/share.js"></script>
</body>
</html>
